name: 3 Build OpenWrt 25.12 armsr/armv8 glibc Rootfs

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-25.12
  TARGET_BOARD: armsr
  TARGET_SUBTARGET: armv8
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 480

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Maximize disk space
      run: |
        echo "===== 清理前磁盘 ====="
        df -h
        sudo rm -rf /usr/share/dotnet \
                    /usr/local/lib/android \
                    /opt/ghc \
                    /usr/local/share/boost \
                    /usr/share/swift \
                    /usr/local/.ghcup \
                    /usr/share/miniconda \
                    /usr/local/share/powershell \
                    /usr/share/az_* \
                    /opt/hostedtoolcache \
                    /usr/local/julia* \
                    /usr/local/lib/node_modules || true
        sudo apt-get clean || true
        sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* || true
        sudo rm -rf /usr/share/doc /usr/share/man /usr/share/locale || true
        echo "===== 清理后磁盘 ====="
        df -h

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo timedatectl set-timezone "$TZ" 2>/dev/null || \
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime 2>/dev/null || true

        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y --no-install-recommends \
          build-essential clang flex bison gawk git gettext \
          libncurses-dev libssl-dev python3 python3-setuptools \
          unzip wget file rsync zlib1g-dev libelf-dev \
          ccache quilt xsltproc swig time \
          libxml-parser-perl
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        df -h

    - name: Clone OpenWrt source
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        cd openwrt
        echo "OpenWrt commit : $(git rev-parse --short HEAD)"
        echo "OpenWrt describe: $(git describe --tags --always 2>/dev/null || echo 'no-tag')"

    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate .config (强制 glibc)
      working-directory: ./openwrt
      run: |
        cat > .config << 'EOF'
        CONFIG_TARGET_armsr=y
        CONFIG_TARGET_armsr_armv8=y
        CONFIG_TARGET_armsr_armv8_DEVICE_generic=y

        CONFIG_DEVEL=y
        CONFIG_TOOLCHAINOPTS=y
        CONFIG_LIBC_USE_GLIBC=y
        # CONFIG_LIBC_USE_MUSL is not set

        CONFIG_TARGET_ROOTFS_TARGZ=y
        # CONFIG_TARGET_ROOTFS_EXT4FS is not set
        # CONFIG_TARGET_ROOTFS_SQUASHFS is not set
        # CONFIG_TARGET_IMAGES_GZIP is not set

        CONFIG_ALL_NONSHARED=y

        CONFIG_PACKAGE_base-files=y
        CONFIG_PACKAGE_busybox=y
        CONFIG_PACKAGE_bash=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_wget-ssl=y
        CONFIG_PACKAGE_ca-bundle=y
        CONFIG_PACKAGE_ca-certificates=y
        CONFIG_PACKAGE_dropbear=y
        CONFIG_PACKAGE_nano=y
        CONFIG_PACKAGE_fwtool=y
        CONFIG_PACKAGE_usbutils=y
        CONFIG_PACKAGE_e2fsprogs=y
        CONFIG_PACKAGE_fdisk=y
        CONFIG_PACKAGE_parted=y
        CONFIG_PACKAGE_lsblk=y
        CONFIG_PACKAGE_block-mount=y
        CONFIG_PACKAGE_kmod-fs-ext4=y
        CONFIG_PACKAGE_kmod-fs-vfat=y
        CONFIG_PACKAGE_kmod-usb-storage=y
        CONFIG_PACKAGE_kmod-usb-storage-uas=y
        CONFIG_PACKAGE_kmod-usb-core=y
        CONFIG_PACKAGE_kmod-usb3=y
        CONFIG_PACKAGE_kmod-usb2=y
        CONFIG_PACKAGE_uci=y
        CONFIG_PACKAGE_ubus=y
        CONFIG_PACKAGE_ubox=y
        CONFIG_PACKAGE_urandom-seed=y
        CONFIG_PACKAGE_urngd=y
        CONFIG_PACKAGE_jsonfilter=y
        CONFIG_PACKAGE_jshn=y
        CONFIG_PACKAGE_libjson-script=y
        CONFIG_PACKAGE_procd=y
        CONFIG_PACKAGE_procd-seccomp=y
        CONFIG_PACKAGE_procd-ujail=y
        CONFIG_PACKAGE_logd=y
        CONFIG_PACKAGE_mtd=y
        CONFIG_PACKAGE_netifd=y
        CONFIG_PACKAGE_fstools=y
        CONFIG_PACKAGE_firewall4=y
        CONFIG_PACKAGE_nftables-json=y
        CONFIG_PACKAGE_kmod-nft-offload=y

        # CONFIG_PACKAGE_dnsmasq is not set
        CONFIG_PACKAGE_dnsmasq-full=y

        CONFIG_PACKAGE_apk-mbedtls=y
        # CONFIG_PACKAGE_opkg is not set

        CONFIG_PACKAGE_ip-full=y
        CONFIG_PACKAGE_ip-bridge=y
        CONFIG_PACKAGE_tc-full=y
        CONFIG_PACKAGE_iptables-nft=y
        CONFIG_PACKAGE_ip6tables-nft=y
        CONFIG_PACKAGE_kmod-ipt-nat=y
        CONFIG_PACKAGE_kmod-ipt-nat6=y
        CONFIG_PACKAGE_odhcpd-ipv6only=y
        CONFIG_PACKAGE_odhcp6c=y
        CONFIG_PACKAGE_ppp=y
        CONFIG_PACKAGE_ppp-mod-pppoe=y

        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-base=y
        CONFIG_PACKAGE_luci-compat=y
        CONFIG_PACKAGE_luci-mod-admin-full=y
        CONFIG_PACKAGE_luci-mod-network=y
        CONFIG_PACKAGE_luci-mod-status=y
        CONFIG_PACKAGE_luci-mod-system=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        CONFIG_PACKAGE_luci-ssl=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y
        CONFIG_PACKAGE_luci-app-firewall=y
        CONFIG_PACKAGE_luci-app-package-manager=y
        CONFIG_PACKAGE_luci-app-attendedsysupgrade=y

        CONFIG_PACKAGE_ruby=y
        CONFIG_PACKAGE_ruby-bigdecimal=y
        CONFIG_PACKAGE_ruby-date=y
        CONFIG_PACKAGE_ruby-digest=y
        CONFIG_PACKAGE_ruby-enc=y
        CONFIG_PACKAGE_ruby-pstore=y
        CONFIG_PACKAGE_ruby-psych=y
        CONFIG_PACKAGE_ruby-stringio=y
        CONFIG_PACKAGE_ruby-yaml=y

        CONFIG_PACKAGE_libc=y
        CONFIG_PACKAGE_libpthread=y
        CONFIG_PACKAGE_librt=y
        CONFIG_PACKAGE_libgcc=y
        CONFIG_PACKAGE_libstdcpp=y

        # CONFIG_SIGNED_PACKAGES is not set
        EOF

        make defconfig

        # defconfig 若冲掉 glibc，再注入一次 seed 并 olddefconfig
        if ! grep -q '^CONFIG_LIBC_USE_GLIBC=y' .config; then
          echo "defconfig 未保留 glibc，重新注入..."
          cat >> .config << 'EOF'
        CONFIG_DEVEL=y
        CONFIG_TOOLCHAINOPTS=y
        CONFIG_LIBC_USE_GLIBC=y
        # CONFIG_LIBC_USE_MUSL is not set
        EOF
          make olddefconfig
        fi

        echo "========== libc 配置 =========="
        grep -E '^CONFIG_(DEVEL|TOOLCHAINOPTS|LIBC|USE_GLIBC|USE_MUSL|LIBC_USE_)' .config || true

        grep -q '^CONFIG_LIBC_USE_GLIBC=y' .config || {
          echo "ERROR: CONFIG_LIBC_USE_GLIBC 未生效"
          exit 1
        }
        if grep -q '^CONFIG_LIBC_USE_MUSL=y' .config; then
          echo "ERROR: 仍然选中了 musl"
          exit 1
        fi

        echo "libc 检查通过：glibc"

    - name: Download sources
      working-directory: ./openwrt
      run: |
        make download -j$(nproc)
        find dl -type f -size -1024c -delete || true

    - name: Compile
      working-directory: ./openwrt
      run: |
        make -j$(nproc) V=s || make -j1 V=s

    - name: Verify glibc rootfs & organize artifacts
      working-directory: ./openwrt
      run: |
        mkdir -p bin_output/rootfs bin_output/packages_glibc

        ROOTFS=$(find bin/targets/${{ env.TARGET_BOARD }}/${{ env.TARGET_SUBTARGET }} -name '*rootfs*.tar.gz' | head -1)
        if [ -z "$ROOTFS" ]; then
          echo "ERROR: 没有找到 rootfs.tar.gz"
          find bin/targets -type f 2>/dev/null | head -50
          exit 1
        fi
        echo "找到 rootfs: $ROOTFS"
        cp -v "$ROOTFS" bin_output/rootfs/

        echo "===== 检查 rootfs 动态链接器 ====="
        tar tzf "$ROOTFS" | grep -E 'lib/ld-|lib64/ld-|libc\.so' || true

        if tar tzf "$ROOTFS" | grep -q 'ld-musl'; then
          echo "ERROR: rootfs 内是 ld-musl，实际编出的是 musl"
          exit 1
        fi

        if tar tzf "$ROOTFS" | grep -qE 'ld-linux-aarch64\.so|ld-linux\.so'; then
          echo "OK: 检测到 ld-linux，确认为 glibc rootfs"
        else
          mkdir -p /tmp/rootfs_check
          tar xzf "$ROOTFS" -C /tmp/rootfs_check ./lib ./lib64 2>/dev/null || \
            tar xzf "$ROOTFS" -C /tmp/rootfs_check lib lib64 2>/dev/null || true
          find /tmp/rootfs_check -name 'ld-*' -o -name 'libc.so*' 2>/dev/null | head -20
          if find /tmp/rootfs_check -name 'ld-musl*' 2>/dev/null | grep -q .; then
            echo "ERROR: 确认是 musl rootfs"
            exit 1
          fi
          if find /tmp/rootfs_check -name 'ld-linux*' 2>/dev/null | grep -q .; then
            echo "OK: 确认为 glibc"
          else
            echo "WARNING: 无法从动态链接器明确确认，请人工检查产物"
          fi
        fi

        echo "===== 收集 libc 相关包 ====="
        for pattern in \
          "libc_*.ipk" "libpthread_*.ipk" "librt_*.ipk" \
          "libgcc_*.ipk" "libstdcpp_*.ipk" "libatomic_*.ipk" "libgomp_*.ipk" \
          "libc-*.apk" "libpthread-*.apk" "librt-*.apk" \
          "libgcc-*.apk" "libstdcpp-*.apk" "glibc*.apk"
        do
          find bin/ -name "$pattern" -exec cp -v {} bin_output/packages_glibc/ \; 2>/dev/null || true
        done

        {
          echo "OpenWrt branch : $REPO_BRANCH"
          echo "Commit         : $(git rev-parse HEAD)"
          echo "Date (UTC)     : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Target         : ${{ env.TARGET_BOARD }}/${{ env.TARGET_SUBTARGET }}"
          echo "Runner         : ubuntu-24.04-arm"
          echo ""
          echo "=== libc related config ==="
          grep -E '^CONFIG_(DEVEL|TOOLCHAINOPTS|LIBC|USE_GLIBC|USE_MUSL|LIBC_USE_)' .config || true
        } > bin_output/BUILD_INFO.txt

        echo "===== 最终产物 ====="
        find bin_output -type f -ls

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_25.12_armsr-armv8_glibc_rootfs
        path: openwrt/bin_output/
        retention-days: 30
        if-no-files-found: error
